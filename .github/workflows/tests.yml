name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test

  config:
    name: config.json has no version number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if config.json contains a version number
        # The version comes from the module directory name (set by the release tag),
        # so it must not be repeated in the code base. History lives in GitHub releases.
        run: |
          php -r '$c = json_decode(file_get_contents("config.json"), true, 512, JSON_THROW_ON_ERROR);
                  foreach (["version", "versions"] as $k) {
                      if (array_key_exists($k, $c)) { fwrite(STDERR, "config.json must not contain \"$k\"\n"); exit(1); }
                  }'
